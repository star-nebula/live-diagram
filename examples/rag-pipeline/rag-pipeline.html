*{box-sizing:border-box;margin:0;padding:0}

.box.dashed{border-style:dashed}

.beam{height:0;border-top:2px dashed var(--c-line)}

.feedtop{height:0;border-top:var(--bw,2px) solid var(--c-line2)}

.pk.diamond{border-radius:1px;transform:rotate(45deg)}
.pkt{position:absolute;border-radius:2px;pointer-events:none}

<script>
(function(){
'use strict';
// ---------- 基础工具 ----------
var mod=function(a,n){return ((a%n)+n)%n};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')};
// 确定性"随机"：hash(种子, 序号) 的纯函数。不用 Math.random，不读墙钟。
function hash(seed,k){
  var h=Math.imul((seed|0)+0x51ed270b,0x85ebca6b)^Math.imul((k|0)+1,0xc2b2ae35);
  h=Math.imul(h^(h>>>15),0x27d4eb2d);h^=h>>>13;h=Math.imul(h,0x165667b1);h^=h>>>16;
  return (h>>>0)/4294967296;
}
function fmtNum(n,f){n=Math.floor(n);return f==='comma'?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','):String(n)}

// ---------- 全局状态 ----------
var cfg=null,ST=document.getElementById('stage'),V={},DYN=[],MACH=[],STREAMS=[],BEAMS=[],FEED=null,CONDBOX=[],CONDPATH=[];
// V 变量表（模板 {var} 取值）；MACH 状态机；DYN 动态文本节点；STREAMS 光点流；BEAMS 触发光束；FEED 日志
var CW=1200,CH=1500,LH=30,FS=21,PRE=0,TH={};
window.__ready=false;window.__pending=null;window.__error='';

function fail(e){var d=document.getElementById('err');
  if(!d){d=document.createElement('div');d.id='err';document.body.appendChild(d)}
  d.textContent+=String(e&&e.stack||e)+'\n';window.__error+=String(e)+'\n'}

function loadConfig(){
  var el=document.getElementById('app-config');
  if(el&&el.textContent.trim())return Promise.resolve(JSON.parse(el.textContent));
  var m=/[?&]config=([^&]+)/.exec(location.search);
  if(m)return fetch(decodeURIComponent(m[1])).then(function(r){return r.json()});
  return Promise.reject(new Error('no config: embed <script id="app-config" type="application/json"> or use ?config='));
}

// ---------- 取值 / 模板 ----------
function tv(k){var v=V[k];if(v==null)return '';return typeof v==='object'?v.text:String(v)}
function fill(s){return String(s).replace(/\{([\w.\-]+)\}/g,function(m,k){var v=V[k];return v==null?m:(typeof v==='object'?v.text:String(v))})}
function cond(w){ // {var, eq|ne|in:[...]}; 数组 = AND
  if(!w)return true;
  if(Array.isArray(w))return w.every(cond);
  var v=tv(w['var']);
  if('eq' in w)return v===String(w.eq);
  if('ne' in w)return v!==String(w.ne);
  if('in' in w)return w['in'].map(String).indexOf(v)>=0;
  return !!v;
}
function col(n){return n?'var(--c-'+n+')':''}

// ---------- run / 行 / 进度条 ----------
function runHtml(r){
  if(typeof r==='string')r={t:r};
  var c=r.c,b=r.b;
  if(r.when&&r.then&&cond(r.when)){if(r.then.c)c=r.then.c;if(r.then.b!=null)b=r.then.b}
  if(r.cursor){var on=mod(V.__t,r.period||1.1)<(r.on||0.6);
    return '<span class="cur" style="background:'+col(c||'gr')+';opacity:'+(on?1:0)+'"></span>'}
  if(r.sw)return '<i class="sw" style="background:'+col(r.sw)+'"></i>';
  var txt;
  if(r.v!=null){var v=V[r.v];if(v==null)v='';
    if(typeof v==='object'){txt=v.text;if(!c&&v.c)c=v.c;if(b==null&&v.b!=null)b=v.b}
    else txt=String(v)}
  else txt=fill(r.t==null?'':r.t);
  var sty='';
  if(c)sty+='color:'+col(c)+';';
  if(b)sty+='font-weight:700;';
  if(r.size)sty+='font-size:'+r.size+'px;';
  return sty?'<span style="'+sty+'">'+esc(txt)+'</span>':esc(txt);
}
function runsHtml(rs){return (rs||[]).map(runHtml).join('')}
function barHtml(b){
  var segs,w=b.w||140,h=b.h||18;
  if(b.gauge){var n=(V[b.gauge+'.num']||0)/(b.max||1),low=V[b.gauge+'.low']==='1',c=low?(b.low||'rd'):(b.high||'gn');
    segs=[{from:0,to:n,c:c,end:true}]}
  else if(b.segments)segs=b.segments;
  else segs=[{from:0,to:b.fixed==null?1:b.fixed,c:b.c||'bl'}];
  var out='<span class="bar" style="width:'+w+'px;height:'+h+'px">';
  segs.forEach(function(s){out+='<u class="'+(s.end?'end':'')+'" style="left:'+(s.from*100)+'%;width:'+((s.to-s.from)*100)+'%;background:'+col(s.c)+'"></u>'});
  if(b.mark!=null)out+='<s style="left:'+(b.mark*100)+'%"></s>';
  return out+'</span>';
}
function normLine(l){
  if(typeof l==='string')l={runs:[l]};
  if(l.alarm){ // 侧栏告警行语法糖，绑定 alarm 状态机
    var id=l.alarm[0],i=l.alarm[1],m=cfg.machines[id],hl=m.hl||'hl',c=m.color||'pu';
    l=Object.assign({align:'left',indent:l.indent==null?14:l.indent,
      runs:[{v:id+'.label'+i,c:'dim',when:{'var':id+'.active',eq:i},then:{c:c,b:1}}],
      when:{'var':id+'.active',eq:i},then:{bg:hl,c:c,b:1}},l);
  }
  if(l.t!=null&&!l.runs&&!l.items)l.runs=[{t:l.t}];
  return l;
}
function lineStyle(l){
  if(l.when&&l.then&&cond(l.when))
    return {bg:l.then.bg?col(l.then.bg):'',c:l.then.c?col(l.then.c):'',b:l.then.b?'700':''};

}
function addLine(parent,l,boxAlign){
  l=normLine(l);
  var d=document.createElement('div');d.className='ln'+(l.items?' flex':'');

  if(l.size)d.style.fontSize=l.size+'px';
  if(l.b)d.style.fontWeight=700;

    d.style.gap=(l.gap||0)+'px';
    l.items.forEach(function(it){

      d.appendChild(e);
      DYN.push({el:e,fn:function(){return it.bar?barHtml(it.bar):runsHtml(it.runs)},last:null});
    });
    DYN.push({el:d,fn:function(){return null},cls:function(){return lineStyle(l)},last:null,lk:null});
  }else{
    d.setAttribute('data-k','text');
    DYN.push({el:d,fn:function(){return runsHtml(l.runs)},cls:function(){return lineStyle(l)},last:null,lk:null});
  }
}
function applyDyn(){
  DYN.forEach(function(d){
    var h=d.fn();
    if(h!==null&&h!==d.last){d.el.innerHTML=h;d.last=h}
    if(d.cls){var s=d.cls(),k=s.bg+'|'+s.c+'|'+s.b;
      if(k!==d.lk){d.el.style.background=s.bg;d.el.style.color=s.c||'';d.el.style.fontWeight=s.b;d.lk=k}}
  });
}

// ---------- 光点（数据包） ----------
function mkpk(color){
  var e=document.createElement('div');e.className='pk';
  if(TH.packetShape==='diamond')e.classList.add('diamond');
  var sz=TH.packetSize||12;
  e.style.width=e.style.height=sz+'px';e.style.margin=(-sz/2)+'px 0 0 '+(-sz/2)+'px';
  e.style.background=col(color)||color;
  if(TH.glow){e.style.color=e.style.background;e.classList.add('pkglow')}
  ST.appendChild(e);return e;
}
function mktrail(color){ // 彗星尾迹：沿行进方向渐隐的短光带（层序在头点之下）
  var h=Math.max(3,Math.round((TH.packetSize||12)/4));
  var e=document.createElement('div');e.className='pkt';
  e.style.height=h+'px';
  e.style.background='linear-gradient(90deg,transparent,'+(col(color)||color)+' 60%)';
  ST.appendChild(e);return e;
}
function mkpair(color){var t=mktrail(color),h2=mkpk(color);return [h2,t]}
function prepPath(P){P.len=0;P.seg=[];
  for(var i=1;i<P.path.length;i++){var d=Math.abs(P.path[i][0]-P.path[i-1][0])+Math.abs(P.path[i][1]-P.path[i-1][1]);
    P.seg.push(d);P.len+=d}}
function atPath(P,d){ // 折线上走 d 像素后的坐标（曼哈顿长度）
  if(d<0||d>P.len)return null;
  for(var i=0;i<P.seg.length;i++){
    if(d<=P.seg[i]){var a=P.path[i],b=P.path[i+1],f=P.seg[i]?d/P.seg[i]:0;
      return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
    d-=P.seg[i]}
  return P.path[P.path.length-1];
}
function putPk(e,t,P,d){
  var q=atPath(P,d);
  if(!q||(P.gap&&q[1]>P.gap[0]&&q[1]<P.gap[1])){e.style.display='none';t.style.display='none';return}
  e.style.display='block';e.style.left=q[0]+'px';e.style.top=q[1]+'px';
  var c=0,i=0,L=P.tail==null?16:P.tail;
  while(i<P.seg.length-1&&d>c+P.seg[i]){c+=P.seg[i];i++}
  var avail=Math.min(L,d-c);
  if(avail<1){t.style.display='none';return}
  var a=P.path[i],b=P.path[i+1],f=(d-avail/2-c)/P.seg[i];
  var mx=a[0]+(b[0]-a[0])*f,my=a[1]+(b[1]-a[1])*f,
  ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
  t.style.display='block';t.style.width=avail+'px';
  t.style.left=(mx-avail/2)+'px';t.style.top=(my-P.th/2)+'px';
  t.style.transform='rotate('+ang+'deg)';
}

// ---------- 状态机：一切会动的东西都是 t 的纯函数，日志由它们产生 ----------
function pickIdx(m,k){ // 固定种子取值，且不与上一轮重复
  var n=m.values.length,b=Math.floor(hash(m.seed||7,k)*n);
  if(n>1&&b===Math.floor(hash(m.seed||7,k-1)*n))b=(b+1)%n;
  return b;
}
var MK={
 ticker:function(id,m){ // 累计计数：start + rate*t
   return {vars:function(t){V[id]=(m.prefix||'')+fmtNum((m.start||0)+(m.rate||0)*t,m.format)+(m.suffix||'')},
     events:function(){return []}}},
 cycle:function(id,m){ // 轮播：每 period 换一个值，可带附加字段；log 每格一条
   var n=m.values.length;
   function val(j){var v=m.values[m.order?m.order[mod(j,m.order.length)]:mod(j,n)];
     return typeof v==='object'?v:{t:v}}
   return {vars:function(t){var j=Math.floor((t-(m.t0||0))/m.period),v=val(j);
       V[id]=(typeof v==='object'&&(v.c||v.b))?{text:(v.t!=null?v.t:(v.m||'')),c:v.c,b:v.b}
                                            :(v.t!=null?v.t:(v.m||''));
       V[id+'.i']=String(m.order?m.order[mod(j,m.order.length)]:mod(j,n));
       Object.keys(v).forEach(function(k){V[id+'.'+k]=String(v[k])})},
     events:function(lo,hi){if(!m.log)return [];
       var o=[];for(var j=Math.max(0,Math.floor((lo-(m.t0||0))/m.period));j<=Math.ceil((hi-(m.t0||0))/m.period);j++){
         var v=val(j);o.push({t:(m.t0||0)+j*m.period,who:m.log.who,c:m.log.c,m:v.m!=null?v.m:(v.t||''),g:v.g||''})}
       return o}}},
 gauge:function(id,m){ // 仪表：每 period 从 values 重掷一次，v<threshold 为 low 态；bad 指明哪一侧是坏状态；log 记录数值
   var th=m.threshold,dec=m.decimals==null?2:m.decimals;
   function st(k){var v=m.values[pickIdx(m,k)],low=v<th,L=low?(m.low||{}):(m.high||{});
     return {v:v,low:low,label:L.label||'',dest:L.dest||''}}
   return {vars:function(t){var k=Math.floor((t-(m.t0||0))/m.period),s=st(k);
       V[id]=s.v.toFixed(dec);V[id+'.num']=s.v;V[id+'.low']=s.low?'1':'';

         var s=st(k),sc={value:s.v.toFixed(dec),label:s.label,dest:s.dest},

       return o}}},
 worst:function(id,m){ // 汇总：任一 gauge 处于坏状态（.bad）则坏（输出带颜色的文本对象）
   return {vars:function(){

              :{text:m.okText||'ok',c:m.okColor||'gn',b:1}

 worker:function(id,m){ // 工位：busy(period 内前 run 秒，转圈) ⇄ done(打勾)
   var sp=m.spin||['◐','◓','◑','◒'],off=m.off||0;

       var q=on?Math.max(0,Math.floor((ph-0.35)*cps)):99999,a0=I.adv[0],a1=I.adv[1]||'';
       V[id+'.adv0']=a0.slice(0,q);V[id+'.adv1']=q>a0.length+2?a1.slice(0,q-a0.length-2):'';
       V[id+'.status']={text:on?(m.onText||'处置中'):(m.offText||'待命'),c:m.color||'pu',b:1}},
     events:function(lo,hi){if(!m.log)return [];

function clockStr(t){
  var p=FEED.clock.start.split(':').map(Number),
  s=mod(Math.floor(p[0]*3600+p[1]*60+p[2]+t*FEED.clock.rate),86400),
  z=function(n){return (n<10?'0':'')+n};
  return z(Math.floor(s/3600))+':'+z(Math.floor(s/60)%60)+':'+z(s%60);
}
function renderLog(t){
  if(!FEED)return;
  var last=-1;for(var i=0;i<EVT.length;i++){if(EVT[i].t<=t)last=i;else break}
  var n=FEED.rows.length;
  FEED.rows.forEach(function(R,i){
    var ev=EVT[last-(n-1)+i],isNew=i===n-1,key=ev?(ev.t+'|'+ev.m+'|'+isNew):'';
    if(key===R.last)return;R.last=key;
    FEED.cols.forEach(function(c,ci){
      var s=R.cells[ci],txt='',c2='dim',bold=false,op=1;
      if(ev){
        if(c.key==='time')txt=clockStr(ev.t);
        else if(c.key==='who'){txt=ev.who;c2=ev.c;bold=true;op=isNew?1:.8}
        else if(c.key==='m'){txt=ev.m;if(isNew){c2='fg';bold=true}}
        else if(c.key==='g'){txt=ev.g;if(isNew){c2='fg';bold=true}}
      }
      s.textContent=txt;s.style.color=col(c2);s.style.fontWeight=bold?'700':'400';s.style.opacity=op;
    });

}

function styleWaves(t){ // 虚线波浪：加粗亮段逐格吸附在基础虚线上跳进
  CONDPATH.forEach(function(P){
    if(!P.wave)return;
    var on=cond(P.wave.when);
    var k=on?Math.floor(mod(t/P.wave.period,1)*P.waveN):-1;
    if(k===P.lastK)return;P.lastK=k;
    if(k<0){P.hl.setAttribute('opacity','0');return}
    P.hl.setAttribute('opacity','1');
    P.hl.setAttribute('stroke-dashoffset',String(-k*P.dashStep));
  });
}
var EVT=[];
function styleBoxes(){
  CONDBOX.forEach(function(o){
    var on=cond(o.e.when),th=on?o.e.then:{},k=on?'1':'0';
    if(k===o.last)return;o.last=k;
    var el=o.el,e=o.e;
    el.style.backgroundColor=col(th.fill||e.fill)||'';
    el.style.color=col(th.color||e.color||'fg');
    el.style.setProperty('--bw',(th.border!=null?th.border:(e.border!=null?e.border:(TH.borderWidth||2)))+'px');
    el.style.boxShadow=th.glow?'0 0 0 4px color-mix(in srgb,'+col(th.glow)+' 25%,transparent),0 0 16px color-mix(in srgb,'+col(th.glow)+' 50%,transparent)':'';
  });
}
function stylePaths(){
  CONDPATH.forEach(function(P){
    var e=P.e,on=e.when&&cond(e.when),th=on?e.then:{},k=on?'1':'0';
    if(k===P.last)return;P.last=k;
    var c=col(th.color||e.color||'line'),w=th.width||e.width||TH.wireWidth||2;
    P.pa.setAttribute('stroke',c);P.pa.setAttribute('stroke-width',w);
    P.pa.style.opacity=th.opacity!=null?th.opacity:(e.opacity!=null?e.opacity:1);
    if(P.hd){P.hd.setAttribute('fill',c);P.hd.setAttribute('points',P.headPts);P.hd.style.opacity=P.pa.style.opacity}
    if(P.hl){P.hl.setAttribute('stroke',c);P.hl.setAttribute('stroke-width',String(w+2))}
  });
}

// ---------- 唯一入口：seek(t) ----------
window.seek=function(t){
  if(!window.__ready){window.__pending=t;return}
  try{
    V.__t=t;
    MACH.forEach(function(m){m.vars(t)});
    var sig=0; // 光点送达总数 → {packets}（图上的数=真实送达的光点数）
    STREAMS.forEach(function(P){
      if(P.when&&!cond(P.when)){P.el.forEach(function(q){q[0].style.display='none';q[1].style.display='none'});return}
      P.o.forEach(function(o,n){
        var u=(t+PRE+o)/P.period,d=(u-Math.floor(u))*P.len;
        sig+=Math.floor(u);
        putPk(P.el[n][0],P.el[n][1],P,d);
      });
    });
    V.packets=fmtNum(sig,'comma');
    V.clock=FEED?clockStr(t):'';
    BEAMS.forEach(function(A){
      var on=V[A.id+'.active']===String(A.i);
      A.hd.style.color=on?A.c:'var(--c-dim)';
      var k=on?Math.floor(mod(Number(V[A.id+'.phase'])/A.on,1)*A.count):-1;
      A.dashes.forEach(function(s,idx){
        var hot=on&&idx===k;
        s.style.background=hot?A.c:'';
        s.style.height=hot?'5px':'2px';s.style.top=hot?'-3px':'-1px';
        s.style.transform=hot?'scaleX(1.35)':'';
      });
    });
    styleBoxes();stylePaths();styleWaves(t);applyDyn();renderLog(t);
    window.__t=t;
  }catch(e){fail(e)}
};

// ---------- 版面自检（scripts 里 check 子命令逐时刻调用） ----------
window.__check=function(){
  var prob=[],items=[],boxes=[],
  sr=ST.getBoundingClientRect(),sc=sr.width/CW;
  function R(rc){return {l:(rc.left-sr.left)/sc,t:(rc.top-sr.top)/sc,r:(rc.right-sr.left)/sc,b:(rc.bottom-sr.top)/sc}}
  function contentRect(el){
    var g=document.createRange();g.selectNodeContents(el);
    var rs=g.getClientRects(),o=null;
    for(var i=0;i<rs.length;i++){var q=rs[i];
      if(q.width<0.5||q.height<0.5)continue;
      if(!o)o={left:q.left,top:q.top,right:q.right,bottom:q.bottom};
      else{o.left=Math.min(o.left,q.left);o.top=Math.min(o.top,q.top);
        o.right=Math.max(o.right,q.right);o.bottom=Math.max(o.bottom,q.bottom)}}
    return o;
  }
  var els=ST.querySelectorAll('[data-k]');
  for(var i=0;i<els.length;i++){
    var el=els[i],k=el.getAttribute('data-k');
    if(k==='box'||k==='frame'){boxes.push({el:el,r:R(el.getBoundingClientRect()),k:k});continue}
    if(el.getAttribute('data-free'))continue;
    var cr=contentRect(el);if(!cr)continue;
    var rr=R(cr);rr.el=el;rr.txt=el.textContent.trim().slice(0,26);
    items.push(rr);
  }
  function ov(a,b){return Math.min(a.r,b.r)-Math.max(a.l,b.l)>1.5&&Math.min(a.b,b.b)-Math.max(a.t,b.t)>1.5}
  items.forEach(function(a){if(a.l<-0.5||a.t<-0.5||a.r>CW+0.5||a.b>CH+0.5)prob.push('文本超出画布: "'+a.txt+'"')});
  items.forEach(function(a){
    var bx=null;
    for(var i=0;i<boxes.length;i++)if(boxes[i].el.contains(a.el)){bx=boxes[i];break}
    if(bx&&bx.k==='box'){var r=bx.r;
      if(a.l<r.l+1||a.r>r.r-1||a.t<r.t-1||a.b>r.b+1)
        prob.push('文本溢出所在面板: "'+a.txt+'" 文本['+Math.round(a.l)+'-'+Math.round(a.r)+'] 面板['+Math.round(r.l)+'-'+Math.round(r.r)+']')}
  });
  for(var x=0;x<items.length;x++)for(var y=x+1;y<items.length;y++){
    var a=items[x],b=items[y];
    if(a.el.contains(b.el)||b.el.contains(a.el))continue;
    if(ov(a,b))prob.push('文本重叠: "'+a.txt+'" × "'+b.txt+'"');
  }
  items.forEach(function(a){
    boxes.forEach(function(b){
      if(b.k==='frame'||b.el.contains(a.el)||a.el.getAttribute('data-in'))return;
      if(ov(a,b.r))prob.push('文本压在面板上: "'+a.txt+'"');
    });
  });
  for(var p=0;p<boxes.length;p++)for(var q=p+1;q<boxes.length;q++){
    if(boxes[p].k==='frame'||boxes[q].k==='frame')continue;
    if(ov(boxes[p].r,boxes[q].r))prob.push('面板重叠: #'+p+' × #'+q);
  }
  return prob;
};
